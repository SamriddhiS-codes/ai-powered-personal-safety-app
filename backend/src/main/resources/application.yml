server:
  port: 8080

spring:
  application:
    name: ai-powered-personal-safety-app
  datasource:
    url: jdbc:postgresql://localhost:5432/safety_app
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is managed explicitly via docs/DB_SCHEMA.sql
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

ml-service:
    base-url: http://127.0.0.1:8000

app:
  security:
    alert-timestamp-tolerance-minutes: 5
    rate-limit:
      base-limit-per-window: 20
      window-ms: 60000
  checkin:
    countdown-seconds: 30
    grace-seconds: 3
