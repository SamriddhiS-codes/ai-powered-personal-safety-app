server:
  port: 8080
  error:
    include-message: always   # so the app can show validation messages such as "Name is required."

spring:
  application:
    name: ai-powered-personal-safety-app
  datasource:
    url: jdbc:postgresql://localhost:5432/safety_app
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is managed explicitly via docs/DB_SCHEMA.sql
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    # Emails to trusted contacts are sent through this SMTP account. Set MAIL_USERNAME and MAIL_PASSWORD
    # (for Gmail, an "app password"). Without them the app still works and just skips the emails.
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 8000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

ml-service:
    base-url: http://127.0.0.1:8000

app:
  auth:
    # Key that signs login tokens. Set JWT_SECRET (32+ characters) in real use; the default is for local development only.
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-use-0123456789}
  security:
    alert-timestamp-tolerance-minutes: 5
    rate-limit:
      base-limit-per-window: 20
      window-ms: 60000
  checkin:
    countdown-seconds: 30
    grace-seconds: 3
